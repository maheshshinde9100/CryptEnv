version: '3.8'

# Local stack: Postgres + MailHog + API + Dashboard.
# Passwords below are for LOCAL DEV ONLY — never reuse in production.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptenv-postgres
    environment:
      POSTGRES_DB: cryptenv
      POSTGRES_USER: cryptenv
      POSTGRES_PASSWORD: cryptenv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptenv -d cryptenv"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cryptenv-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build:
      context: ./cryptenv-core
      dockerfile: Dockerfile
    container_name: cryptenv-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cryptenv
      DB_USER: cryptenv
      DB_PASS: cryptenv_password
      JWT_SECRET: local-dev-jwt-secret-change-me-use-openssl-rand-hex-32
      JWT_EXPIRATION: 900000
      # Base64 of 32 bytes — valid locally, NEVER use in production.
      MASTER_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_TRUST_PROXY: "false"
      SPRINGDOC_ENABLED: "true"
      # Mail defaults to MailHog. To send real mail locally, run compose with
      # --env-file cryptenv-core/.env.production (Brevo/Resend values are picked up).
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailhog}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      CRYPTENV_MAIL_PROVIDER: ${CRYPTENV_MAIL_PROVIDER:-auto}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CRYPTENV_NOTIFICATIONS_FROM: ${CRYPTENV_NOTIFICATIONS_FROM:-no-reply@cryptenv.local}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: node:20-alpine
    container_name: cryptenv-dashboard
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./cryptenv-dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      - app

volumes:
  postgres_data:
  dashboard_node_modules:
