# ============================================================
# TEST-ONLY configuration — NOT production credentials
# ============================================================
# These values exist solely so unit/integration tests can boot
# an isolated Spring context with H2. They are:
#   • Fake / deterministic placeholders
#   • Never used against Neon, Render, or any real database
#   • Safe to commit (no live passwords or production keys)
#
# Production secrets MUST come from environment variables only
# (see application.properties.example and .env.production).
# ============================================================

spring.profiles.active=test
spring.application.name=CryptEnv-Test

# --- H2 In-Memory DataSource (ephemeral; wiped every test run) ---
spring.datasource.url=jdbc:h2:mem:cryptenv_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE,COMMENT,ROW,TIMESTAMP,YEAR,MONTH,DAY,HOUR,MINUTE,SECOND
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway off in tests (Hibernate creates schema) ---
spring.flyway.enabled=false
cryptenv.flyway.enabled=false

# --- JWT (TEST PLACEHOLDER — not a production secret) ---
jwt.secret=test-only-jwt-secret-not-for-production-use-256bits-min
jwt.expiration=86400000

# --- Swagger ---
springdoc.swagger-ui.enabled=false

# --- Logging ---
logging.level.com.maheshshinde.CryptEnv=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# --- Encryption (TEST PLACEHOLDER Base64 of repeated "test-…" ASCII; AES-256 length only) ---
# Decodes to non-production key material used only inside H2 unit tests.
encryption.master.key=dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGU=
cryptenv.master-key=dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGU=

# Rate limiter on during tests (high limits so suites stay fast)
cryptenv.rate-limit.enabled=true
cryptenv.rate-limit.capacity=10000
cryptenv.rate-limit.refill-per-minute=10000
cryptenv.rate-limit.auth-capacity=10000
cryptenv.rate-limit.auth-refill-per-minute=10000
