# ============================================================
# Test Application Configuration (overrides main properties)
# Uses H2 in-memory DB — no PostgreSQL or Flyway required
# ============================================================

spring.application.name=CryptEnv-Test

# --- H2 In-Memory DataSource ---
spring.datasource.url=jdbc:h2:mem:cryptenv_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE,COMMENT,ROW,TIMESTAMP,YEAR,MONTH,DAY,HOUR,MINUTE,SECOND
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway (disabled for tests — Hibernate creates schema) ---
spring.flyway.enabled=false
cryptenv.flyway.enabled=false

# --- JWT ---
jwt.secret=test-secret-key-for-unit-tests-only-at-least-256-bits-long
jwt.expiration=86400000

# --- Swagger ---
springdoc.swagger-ui.enabled=false

# --- Logging (quieter in tests) ---
logging.level.com.maheshshinde.CryptEnv=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# --- Encryption (MasterKeyService requires a valid 256-bit Base64 AES key) ---
# 32 bytes Base64-encoded = valid AES-256 key for both MasterKeyService and EncryptionService
encryption.master.key=dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGU=
cryptenv.master-key=dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGU=
