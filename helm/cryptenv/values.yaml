replicaCount: 2

image:
  repository: cryptenv/cryptenv-core
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

database:
  host: postgres
  port: 5432
  name: cryptenv
  username: cryptenv
  existingSecret: cryptenv-db-credentials

redis:
  enabled: true
  host: redis
  port: 6379

env:
  spring:
    profiles:
      active: production
  logging:
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
